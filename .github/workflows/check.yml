# R CMD check her gönderimde ve etikette. Paket hiçbir R ortamında
# çalıştırılmadan 0.3.0'a kadar geldi; tek isimli ng_bulk() isteğinin
# API'ye dizi yerine düz metin gönderdiği ancak çalıştırılınca görüldü.
name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # DESCRIPTION: Depends R (>= 4.1.0)
        r: ['4.1', 'release']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
